<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTCB Study Game</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14222e;--mute:#5b6b78;--line:#cfd9e1;--acc:#0b6e6e;--acc-ink:#fff;--ok:#1b7f45;--bad:#b3261e;--okbg:#e3f4ea;--badbg:#fbe9e7;--warn:#8a5a00;--warnbg:#fff1d6}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18232c;--ink:#e8eef2;--mute:#93a3af;--line:#2c3b47;--acc:#4fc3c3;--acc-ink:#06201f;--ok:#6fd19a;--bad:#ff8a80;--okbg:#17342a;--badbg:#3a1f1c;--warn:#ffd27a;--warnbg:#3a2e12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:600px}
h1{font-size:18px;margin:0 0 12px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
select,button,input{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;flex:1;min-width:140px}
.stats{color:var(--mute);font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px;overflow:hidden}
.bar div{height:100%;background:var(--acc);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 22px;text-align:center;min-height:270px;display:flex;flex-direction:column;justify-content:center}
.big{font:700 clamp(26px,7vw,40px)/1.2 Georgia,"Times New Roman",serif;margin:8px 0;overflow-wrap:anywhere}
.q{font-size:20px;font-weight:600;margin:10px 0 16px;overflow-wrap:anywhere}
.cat{color:var(--mute);font-size:14px}
.lab{color:var(--mute);font-size:14px;margin-top:18px}
.ans{font:600 clamp(22px,6vw,30px)/1.2 Georgia,serif;color:var(--acc);margin:2px 0 8px;overflow-wrap:anywhere}
.use{font-size:17px;margin:4px 0 0}
.badge{display:inline-block;margin-top:14px;padding:3px 10px;border-radius:12px;background:var(--warnbg);color:var(--warn);font-weight:600;font-size:14px;align-self:center}
.row{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 20px;cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.m{color:var(--bad);border-color:var(--bad)}
button.s{font-size:13px;padding:5px 12px;color:var(--mute)}
button.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px}
button.opt:hover:not(.lock){border-color:var(--acc)}
.lock{pointer-events:none}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:18px;text-align:center;margin-top:12px}
.fb{margin-top:14px;padding:12px;border-radius:6px;text-align:left;background:var(--bg)}
.fb b{display:block}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}
.list{text-align:left;margin:12px 0 0;padding-left:18px;font-size:15px}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{color:var(--mute);font-size:13px;margin-top:16px;text-align:center}
.warn{color:var(--warn);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>PTCB study game: stems and top 200 drugs</h1>
<div class="ctl">
  <select id="cat" aria-label="What to study"></select>
  <select id="mode" aria-label="Mode"><option value="mc">Multiple choice</option><option value="fc">Flashcards</option><option value="ty">Type the class (stems)</option></select>
  <select id="size" aria-label="Session size"><option value="10">10 cards</option><option value="20" selected>20 cards</option><option value="40">40 cards</option><option value="400">All cards</option></select>
</div>
<div class="stats"><span id="pos"></span><span id="score"></span></div>
<div class="bar"><div id="prog"></div></div>
<div id="view"></div>
<p class="hint" id="hint"></p>
</main>

document.addEventListener('keydown',e=>{
  const t=e.target.tagName;if(t==='SELECT'||screen!=='play')return;
  const u=cur.ui,go=e.key==='Enter'||e.key===' ';
  if(u==='mc'){
    if(!answered&&/^[1-4]$/.test(e.key)){e.preventDefault();pick(+e.key-1)}
    else if(answered&&go){e.preventDefault();nextQ()}}
  else if(u==='fc'){
    if(!flipped&&go){e.preventDefault();flip()}
    else if(flipped&&e.key==='ArrowRight'){e.preventDefault();fcGrade(true)}
    else if(flipped&&e.key==='ArrowLeft'){e.preventDefault();fcGrade(false)}}
  else if(e.key==='Enter'){e.preventDefault();if(!flipped)flip();else if(!chk)tyCheck();else tyNext()}});
const sel=$('cat');
const cs=D.cards,nS=cs.filter(c=>c.k==='stem').length;
sel.append(new Option(`Everything (${cs.length})`,'all'),new Option(`All stems (${nS})`,'stems'),new Option(`All top 200 drugs (${cs.length-nS})`,'drugs'),new Option(`Controlled substances only (${cs.filter(c=>c.s).length})`,'ctrl'));
const g1=document.createElement('optgroup');g1.label='Stem categories';D.stemCats.forEach(c=>g1.append(new Option(c,'s:'+c)));
const g2=document.createElement('optgroup');g2.label='Drug categories';D.drugCats.forEach(c=>g2.append(new Option(c,'d:'+c)));
sel.append(g1,g2);
['cat','mode','size'].forEach(id=>$(id).onchange=()=>{$(id).blur();screen='home';render()});
render();
</script>
</body>
</html>
